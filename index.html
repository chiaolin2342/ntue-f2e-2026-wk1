<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動態天氣卡片 | Weather Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      position: relative;
      font-family: 'Hind Vadodara', sans-serif, "微軟正黑體";
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2e3846 0%, #151a21 100%);
      overflow: hidden;
    }

    .tip {
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    label {
      cursor: pointer;
    }

    .daybox {
      width: 85%;
      max-width: 400px;
      background-color: #f3f3f3;
      box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .daybox:hover {
      transform: translateY(-4px);
    }

    .daybox:hover .bottom {
      height: 100px;
    }

    .daybox:hover .dayweather {
      opacity: 1;
      top: 0px;
    }

    /* 頂部展示區 */
    .top {
      height: 330px;
      background: linear-gradient(20deg, #19283D, #1D678F);
      background-size: 100% 300%;
      animation: daylight 20s ease infinite alternate;
      border-radius: 12px 12px 0px 0px;
      overflow: hidden;
    }

    @keyframes daylight {
      0% {
        background-position: 100% 0%;
      }
      100% {
        background-position: 100% 100%;
      }
    }

    /* 氣溫折線圖：向上位移至卡片中上方，徹底避開左下方的溫度數字 */
    .temsvg {
      width: 100%;
      height: 140px;
      position: absolute;
      top: 50px;
      left: 0;
      z-index: 2;
    }

    .temsvg polyline {
      stroke: #f3f3f3;
      stroke-width: 2px;
      fill: none;
      opacity: 0.2;
      transition: 0.5s 0.2s;
    }

    .temsvg text {
      fill: #ffffff;
      font-size: 11px;
      text-anchor: middle;
      opacity: 0;
      transition: 0.5s 0.3s;
    }

    .temsvg circle {
      fill: #f3f3f3;
      opacity: 0.25;
      transition: 0.5s;
    }

    /* 雨滴動畫 */
    .rain {
      width: 2px;
      height: 12px;
      position: absolute;
      left: 45px;
      bottom: 15px;
      animation: raindrop 1s infinite linear;
      background-color: #f3f3f3;
    }

    .rain2 {
      left: 70px;
      bottom: 20px;
      animation-delay: -0.4s;
    }

    .rain3 {
      left: 30px;
      bottom: 20px;
      animation-delay: -0.7s;
    }

    @keyframes raindrop {
      0% {
        transform: translateY(0px);
        opacity: 1;
      }
      100% {
        transform: translateY(50px);
        opacity: 0;
      }
    }

    /* 月亮 */
    .top .moon {
      width: 50px;
      height: 50px;
      border-radius: 100%;
      position: absolute;
      left: 45px;
      top: 45px;
      animation: moonmove 20s infinite alternate ease-in-out;
      transition: 0.5s;
    }

    @keyframes moonmove {
      0% {
        box-shadow: 15px -15px #FFD633;
        transform: translateX(-10px) translateY(10px);
      }
      100% {
        box-shadow: -22px 22px #FFD633;
        transform: translateX(20px) translateY(-20px);
      }
    }

    /* 雲朵 */
    .cloud {
      width: 100px;
      height: 36px;
      position: absolute;
      right: 35px;
      bottom: 60px;
      border-radius: 20px;
      animation: clouddrift 3s infinite ease-in-out;
      background-color: #f3f3f3;
      box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.25);
      transition: 0.5s;
    }

    .cloud:before, .cloud:after {
      content: "";
      background-color: #f3f3f3;
      display: block;
      width: 50px;
      height: 50px;
      border-radius: 100%;
      position: absolute;
    }

    .cloud:before {
      left: 16px;
      top: -26px;
    }

    .cloud:after {
      left: 38px;
      top: -18px;
    }

    @keyframes clouddrift {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* 當前氣溫資訊（位於左下方） */
    .text_area {
      position: absolute;
      bottom: 22px;
      left: 25px;
      color: #f3f3f3;
      pointer-events: none;
      z-index: 1;
    }

    .text_area .temperature {
      font-size: 68px;
      line-height: 68px;
      font-weight: 300;
      margin-bottom: 6px;
    }

    .text_area .infos {
      font-size: 13px;
      opacity: 0.75;
      line-height: 1.5;
    }

    /* 底部一週天氣 */
    .bottom {
      height: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #ffffff;
      box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.05);
      border-radius: 0px 0px 12px 12px;
      overflow: hidden;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 10px;
    }

    .bottom .dayweather {
      width: calc(100% / 7);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      top: 15px;
      transition: 0.4s ease;
    }

    .bottom .dayweather h3 {
      margin: 8px 0 4px;
      font-size: 10px;
      color: rgba(34, 34, 34, 0.7);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .bottom .dayweather svg {
      width: 32px;
      height: 32px;
    }

    .bottom .dayweather svg .sun {
      fill: #FFD633;
      stroke: rgba(255, 214, 51, 0.3);
      stroke-width: 6px;
    }

    .bottom .dayweather svg .rain {
      stroke: #4DACFF;
      stroke-width: 2px;
    }

    .bottom .dayweather svg .cloud {
      fill: #B0B5BC;
    }

    .dayweather:nth-child(1) { transition-delay: 0.05s; }
    .dayweather:nth-child(2) { transition-delay: 0.1s; }
    .dayweather:nth-child(3) { transition-delay: 0.15s; }
    .dayweather:nth-child(4) { transition-delay: 0.2s; }
    .dayweather:nth-child(5) { transition-delay: 0.25s; }
    .dayweather:nth-child(6) { transition-delay: 0.3s; }
    .dayweather:nth-child(7) { transition-delay: 0.35s; }

    /* 切換顯示氣溫走勢 */
    #switch_night {
      display: none;
    }

    #switch_night:checked + .top .moon,
    #switch_night:checked + .top .cloud,
    #switch_night:checked + .top .rain {
      opacity: 0.15;
    }

    #switch_night:checked + .top .temsvg circle,
    #switch_night:checked + .top .temsvg polyline {
      opacity: 0.95;
    }

    #switch_night:checked + .top .temsvg text {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="tip">點擊上方卡片切換「氣溫走勢」，滑鼠懸停查看「一週天氣」</div>

  <div class="daybox">
    <label>
      <input type="checkbox" id="switch_night">
      <div class="top">
        <!-- 氣溫折線圖（移至上方獨立視野，點與文字向上置中對齊） -->
        <svg class="temsvg" viewBox="0 0 350 100">
          <polyline points="25,70 75,55 125,35 175,42 225,20 275,35 325,60"></polyline>
          
          <circle cx="25" cy="70" r="3.5"></circle>
          <text x="25" y="55">18°</text>

          <circle cx="75" cy="55" r="3.5"></circle>
          <text x="75" y="40">21°</text>

          <circle cx="125" cy="35" r="3.5"></circle>
          <text x="125" y="20">26°</text>

          <circle cx="175" cy="42" r="3.5"></circle>
          <text x="175" y="27">24°</text>

          <circle cx="225" cy="20" r="3.5"></circle>
          <text x="225" y="8">29°</text>

          <circle cx="275" cy="35" r="3.5"></circle>
          <text x="275" y="20">25°</text>

          <circle cx="325" cy="60" r="3.5"></circle>
          <text x="325" y="45">20°</text>
        </svg>

        <!-- 月亮 -->
        <div class="moon"></div>

        <!-- 雲朵與雨滴 -->
        <div class="cloud">
          <div class="rain rain1"></div>
          <div class="rain rain2"></div>
          <div class="rain rain3"></div>
        </div>

        <!-- 當前天氣資訊（保留在左下方，與折線圖完全錯開） -->
        <div class="text_area">
          <div class="temperature">24°C</div>
          <div class="infos">
            <div class="address">台北市, 台灣</div>
            <div class="time">星期二 下午 04:30</div>
          </div>
        </div>
      </div>
    </label>

    <!-- 底部未來一週預報 -->
    <div class="bottom">
      <div class="dayweather">
        <h3>MON</h3>
        <svg viewBox="0 0 50 50">
          <circle class="sun" cx="25" cy="25" r="12"></circle>
        </svg>
      </div>
      <div class="dayweather">
        <h3>TUE</h3>
        <svg viewBox="0 0 50 50">
          <circle class="sun" cx="20" cy="20" r="8"></circle>
          <path class="cloud" d="M20 28 A8 8 0 0 1 36 28 A5 5 0 0 1 34 35 L14 35 A6 6 0 0 1 20 28 Z"></path>
        </svg>
      </div>
      <div class="dayweather">
        <h3>WED</h3>
        <svg viewBox="0 0 50 50">
          <path class="cloud" d="M18 22 A8 8 0 0 1 34 22 A5 5 0 0 1 32 29 L12 29 A6 6 0 0 1 18 22 Z"></path>
          <line class="rain" x1="18" y1="33" x2="16" y2="39"></line>
          <line class="rain" x1="26" y1="33" x2="24" y2="39"></line>
        </svg>
      </div>
      <div class="dayweather">
        <h3>THU</h3>
        <svg viewBox="0 0 50 50">
          <circle class="sun" cx="25" cy="25" r="12"></circle>
        </svg>
      </div>
      <div class="dayweather">
        <h3>FRI</h3>
        <svg viewBox="0 0 50 50">
          <circle class="sun" cx="20" cy="20" r="8"></circle>
          <path class="cloud" d="M20 28 A8 8 0 0 1 36 28 A5 5 0 0 1 34 35 L14 35 A6 6 0 0 1 20 28 Z"></path>
        </svg>
      </div>
      <div class="dayweather">
        <h3>SAT</h3>
        <svg viewBox="0 0 50 50">
          <path class="cloud" d="M18 22 A8 8 0 0 1 34 22 A5 5 0 0 1 32 29 L12 29 A6 6 0 0 1 18 22 Z"></path>
          <line class="rain" x1="18" y1="33" x2="16" y2="39"></line>
          <line class="rain" x1="26" y1="33" x2="24" y2="39"></line>
        </svg>
      </div>
      <div class="dayweather">
        <h3>SUN</h3>
        <svg viewBox="0 0 50 50">
          <circle class="sun" cx="25" cy="25" r="12"></circle>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
